<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Last Question ❤️</title>


<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}



body{

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;


font-family:Poppins,sans-serif;


background:

radial-gradient(circle,#ff758c,#ff416c,#3a0ca3);


color:white;


}



/* Main */

.container{


width:90%;

max-width:900px;


padding:50px;


text-align:center;


background:

rgba(255,255,255,.15);


backdrop-filter:blur(20px);


border-radius:35px;


box-shadow:

0 25px 70px rgba(0,0,0,.5);


}





h1{


font-family:'Great Vibes';

font-size:95px;


}





.heart{


font-size:120px;


animation:beat 1s infinite;


}



@keyframes beat{


50%{

transform:scale(1.25);


}

}




.message{


font-size:22px;

line-height:1.8;

margin:30px;


}




.buttons{


display:flex;

justify-content:center;

gap:30px;

flex-wrap:wrap;


}



button{


padding:18px 45px;


border:none;


border-radius:50px;


font-size:20px;


font-weight:bold;


cursor:pointer;


transition:.4s;


}




.yes{


background:#ff006e;

color:white;


}



.time{


background:white;

color:#ff416c;


}




button:hover{


transform:scale(1.15);


box-shadow:0 0 30px white;


}





/* Hearts */

.floating{


position:absolute;


bottom:-50px;


font-size:30px;


animation:float 8s linear infinite;


}



@keyframes float{


to{

transform:translateY(-120vh);

}


}




</style>

</head>



<body>




<div class="container">


<div class="heart">

❤️

</div>



<h1>

Anu...

</h1>




<div class="message">


I know I hurt you.

<br>

I know saying sorry cannot erase everything instantly.

<br><br>


But I want you to know...

I truly understand my mistake.

<br><br>


Will you give me a chance to prove

that I can be better?


❤️


</div>




<div class="buttons">


<button class="yes" onclick="yesAnswer()">

💖 Yes, I Forgive You

</button>



<button class="time" onclick="timeAnswer()">

🤍 I Need More Time

</button>



</div>



</div>





<script>


function yesAnswer(){

window.location.href="page13.html";


}



function timeAnswer(){

window.location.href="page14.html";


}




setInterval(()=>{


let h=document.createElement("div");


h.className="floating";


h.innerHTML=
["❤️","💕","🌹","💖"]
[Math.floor(Math.random()*4)];


h.style.left=Math.random()*100+"%";


h.style.animationDuration=
(5+Math.random()*5)+"s";


document.body.appendChild(h);



setTimeout(()=>{

h.remove();

},10000);



},400);



</script>




</body>

</html>
