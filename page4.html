<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I'm Sorry Anu ❤️</title>


<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}



body{

height:100vh;

overflow:hidden;

font-family:Poppins,sans-serif;


background:

linear-gradient(
rgba(0,0,0,.65),
rgba(0,0,0,.75)
),

url("images/anu.jpg");


background-size:cover;

background-position:center;


display:flex;

align-items:center;

justify-content:center;


color:white;


}



/* Rain */


.rain{

position:absolute;

width:2px;

height:100px;

background:rgba(255,255,255,.5);

top:-100px;


animation:rain linear infinite;


}



@keyframes rain{


to{

transform:translateY(120vh);

}

}




/* Main Box */


.card{


width:90%;

max-width:900px;


padding:50px;


text-align:center;


background:rgba(255,255,255,.12);


backdrop-filter:blur(15px);


border-radius:30px;


box-shadow:

0 20px 70px black;


}



h1{


font-family:'Great Vibes';

font-size:90px;


color:#ff8fab;


}



.heart{


font-size:80px;


animation:beat 1s infinite;


}




@keyframes beat{


50%{

transform:scale(1.3);

}


}



h2{


font-size:32px;

margin:20px;


}



.message{


font-size:21px;

line-height:2;


min-height:220px;


}




button{


margin-top:30px;


padding:18px 50px;


border:none;


border-radius:50px;


background:#ff4d6d;


color:white;


font-size:18px;


cursor:pointer;


font-weight:bold;


}



button:hover{


transform:scale(1.1);


}




</style>


</head>



<body>




<script>


// Rain creation


for(let i=0;i<150;i++){


let drop=document.createElement("div");


drop.className="rain";


drop.style.left=Math.random()*100+"%";


drop.style.animationDuration=
(0.5+Math.random()*1.5)+"s";


drop.style.animationDelay=
Math.random()*5+"s";


document.body.appendChild(drop);


}



</script>





<div class="card">


<div class="heart">

💔

</div>


<h1>

Anu...

</h1>


<h2>

Seeing You Cry Hurt Me The Most

</h2>



<div class="message" id="typing">


</div>



<button onclick="nextPage()">

Read My Promise ❤️

</button>



</div>





<script>


const text=`

When I saw tears in your eyes,

I realized how much my actions hurt you.

Those three days we spent together
were precious to me.

You gave me your time,
your love,
and your trust.

And I became the reason for your sadness.

I never want to see you hurt because of me again.

Your smile means more to me
than anything else.

I'm sorry for making you cry, Anu.

❤️

`;



let count=0;


function type(){


if(count<text.length){


document.getElementById("typing").innerHTML+=
text.charAt(count);


count++;


setTimeout(type,45);


}


}


type();





function nextPage(){

window.location.href="page5.html";


}



</script>



</body>

</html>
