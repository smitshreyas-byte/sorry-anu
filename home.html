<!DOCTYPE html>
<html lang="en">

<head>

<link rel="stylesheet" href="style.css">


<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">


<style>

body{

background:

linear-gradient(
135deg,
#ff758c,
#ff7eb3,
#ffd1dc
);

}



.profile{

text-align:center;

}



.profile img{


width:180px;

height:180px;

border-radius:50%;


object-fit:cover;


border:6px solid white;


box-shadow:

0 0 40px rgba(255,255,255,.8);


}



.title{


font-family:'Great Vibes';

font-size:55px;

margin-top:20px;


}



.names{


font-size:25px;

margin:15px;


}



.heart{


font-size:80px;

animation:heartbeat 1s infinite;


}



@keyframes heartbeat{


50%{

transform:scale(1.2);

}


}





.message{


line-height:1.8;

font-size:17px;


}




.music-btn{


position:absolute;


right:20px;

top:20px;


background:white;


border:none;


border-radius:50%;

height:45px;

</style>


</head>

<script>


function nextPage(){


window.location.href="page2.html";


}





// floating hearts


setInterval(()=>{


let h=document.createElement("div");


h.innerHTML="❤️";


h.style.position="fixed";


h.style.bottom="-50px";


h.style.left=Math.random()*100+"%";


h.style.fontSize="30px";


h.style.animation="float 8s linear";


document.body.appendChild(h);



setTimeout(()=>{


h.remove();


},8000);



},600);



</script>
