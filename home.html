<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Anu ❤️</title>


<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{


min-height:100vh;


display:flex;


justify-content:center;


align-items:center;


font-family:Poppins,sans-serif;


overflow:hidden;


color:white;



background:

linear-gradient(
135deg,
#ff416c,
#ff4b2b,
#ff758c,
#ff7eb3
);


background-size:400% 400%;


animation:bg 12s infinite alternate;


}



@keyframes bg{


100%{

background-position:right;

}


}




/* Main Card */


.card{


width:min(90%,900px);


padding:40px;


text-align:center;



background:

rgba(255,255,255,.15);



backdrop-filter:blur(20px);



border-radius:35px;



box-shadow:

0 30px 80px rgba(0,0,0,.5);



animation:

show 1.5s ease;



}



@keyframes show{


from{

opacity:0;

transform:

translateY(80px)
scale(.7);

}


to{

opacity:1;

transform:

translateY(0)
scale(1);

}


}





h1{


font-family:'Great Vibes';


font-size:

clamp(55px,10vw,100px);



text-shadow:

0 0 30px white;



}



.names{


font-size:

clamp(22px,5vw,40px);



margin:15px;


}



.heart{


font-size:45px;


animation:

beat 1s infinite;


}



@keyframes beat{


50%{

transform:scale(1.3);


}


}





/* Photo */


.photo{


margin:30px auto;


width:

clamp(180px,40vw,300px);


height:

clamp(180px,40vw,300px);


border-radius:50%;


overflow:hidden;



border:

8px solid white;



box-shadow:

0 0 40px white;



animation:

photoFloat 4s infinite;



}



.photo img{


width:100%;


height:100%;


object-fit:cover;


}




@keyframes photoFloat{


50%{

transform:translateY(-15px);

}


}




.message{


font-size:

clamp(15px,3vw,22px);


line-height:1.8;


}



button{


margin-top:35px;


padding:

16px 45px;



border:none;


border-radius:50px;


background:white;


color:#ff416c;


font-size:18px;


font-weight:bold;


cursor:pointer;



animation:pulse 2s infinite;


}




@keyframes pulse{


50%{

transform:scale(1.1);

}


}





.music{


position:fixed;


top:20px;


right:20px;


}



.music button{


margin:0;


padding:12px 20px;


font-size:14px;


}




/* Hearts */


.floating{


position:absolute;


bottom:-50px;


font-size:30px;


animation:rise linear infinite;


}



@keyframes rise{


100%{


transform:

translateY(-120vh)
rotate(360deg);


opacity:0;


}



}




@media(max-width:500px){


.card{

padding:25px;

}


}



</style>

</head>


<body>




<!-- Music -->


<audio id="music" loop>


<source src="music/song.mp3" type="audio/mp3">


</audio>



<div class="music">


<button onclick="playMusic()">

🎵 Music

</button>


</div>






<div class="card">



<div class="heart">

❤️

</div>



<h1>

Our Little World

</h1>




<div class="names">


Shreyash ❤️ Anu


</div>




<div class="photo">


<img src="images/couple.jpg">


</div>




<div class="message">


I created this little journey

because you are special to me.


<br>


I know I made a mistake...

but my heart wants to say

one thing:


<br><br>


<strong>

I am truly sorry, Anu ❤️

</strong>


</div>




<button onclick="nextPage()">


Open My Heart 💌


</button>



</div>







<script>


function nextPage(){


window.location.href="page2.html";


}




function playMusic(){


let music=document.getElementById("music");


music.play();


}




// Floating hearts


setInterval(()=>{


let h=document.createElement("div");


h.className="floating";


h.innerHTML=

["❤️","💕","🌹","💖","✨"]
[Math.floor(Math.random()*5)];



h.style.left=Math.random()*100+"%";



h.style.animationDuration=

(5+Math.random()*6)+"s";



document.body.appendChild(h);



setTimeout(()=>{


h.remove();


},12000);



},400);



</script>




</body>

</html>
