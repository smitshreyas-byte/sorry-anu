<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Bouquet For Anu 🌹</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;


font-family:Poppins,sans-serif;


background:

linear-gradient(
135deg,
#8e0e00,
#ff4e50,
#ff9a9e
);


color:white;

}



/* Main */

.container{

width:90%;

max-width:900px;

padding:50px;

background:

rgba(255,255,255,.15);


backdrop-filter:blur(20px);


border-radius:35px;


text-align:center;


box-shadow:

0 25px 60px rgba(0,0,0,.4);


}



h1{

font-family:'Great Vibes';

font-size:90px;

}



.subtitle{

font-size:22px;

margin:20px;

}




/* Bouquet */


.bouquet{


font-size:100px;


animation:bloom 3s infinite;


}



@keyframes bloom{


0%{

transform:scale(.8);

}


50%{

transform:scale(1.1);

}


100%{

transform:scale(.8);

}


}



.flowers{

font-size:70px;

margin:20px;


}




.message{


font-size:22px;


line-height:1.8;


}





button{


margin-top:40px;


padding:18px 55px;


border:none;


border-radius:50px;


background:white;


color:#d6336c;


font-size:18px;


font-weight:bold;


cursor:pointer;


}


button:hover{

transform:scale(1.1);

}




/* Hearts */


.heart{

position:absolute;

bottom:-50px;

font-size:30px;


animation:float 8s linear infinite;


}



@keyframes float{


to{

transform:translateY(-120vh);


}


}



</style>


</head>



<body>




<div class="container">


<h1>

For You Anu 🌹

</h1>



<div class="bouquet">

💐

</div>



<div class="flowers">

🌹🌹🌹🌹🌹

</div>



<div class="message">


This bouquet has a flower for every reason

I am grateful for you.


<br><br>


For your smile...

For your kindness...

For your love...

For every beautiful memory...


<br><br>


I know flowers cannot fix everything,

but I hope they remind you

how special you are to me.


❤️


</div>




<button onclick="nextPage()">

One Question For You 💖

</button>


</div>






<script>


function nextPage(){

window.location.href="page12.html";

}




setInterval(()=>{


let h=document.createElement("div");


h.className="heart";


h.innerHTML="❤️";


h.style.left=Math.random()*100+"%";


h.style.animationDuration=

(5+Math.random()*5)+"s";


document.body.appendChild(h);



setTimeout(()=>{

h.remove();

},10000);



},500);



</script>



</body>

</html>
