<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Only For Anu ❤️</title>


<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;


font-family:Poppins,sans-serif;


background:

linear-gradient(
135deg,
#ff758c,
#ff7eb3,
#ffd1dc
);


color:white;

overflow:hidden;

}



.box{


width:90%;

max-width:450px;


padding:40px;


text-align:center;


background:

rgba(255,255,255,.2);


backdrop-filter:blur(20px);


border-radius:30px;


box-shadow:

0 20px 60px rgba(0,0,0,.4);


}



.lock{

font-size:90px;

animation:beat 1.5s infinite;

}



@keyframes beat{


50%{

transform:scale(1.2);

}


}




h1{


font-family:'Great Vibes';

font-size:65px;


}



p{

margin:20px;

font-size:18px;

}




input{


width:100%;


padding:15px;


border:none;


border-radius:50px;


text-align:center;


font-size:18px;


outline:none;


}



button{


margin-top:20px;


padding:15px 40px;


border:none;


border-radius:50px;


background:white;


color:#ff416c;


font-size:18px;


font-weight:bold;


cursor:pointer;


}




#error{


margin-top:15px;

color:#fff;

}



.heart{


position:absolute;

bottom:-50px;


font-size:30px;


animation:float 8s linear infinite;


}



@keyframes float{


to{

transform:translateY(-120vh);


}


}



</style>


</head>



<body>



<div class="box">


<div class="lock">

🔐

</div>



<h1>

For Anu ❤️

</h1>



<p>

This little world is only for you...

</p>




<input

type="password"

id="password"

placeholder="Enter Secret Password ❤️"

>



<button onclick="unlock()">

Open My Heart 💕

</button>



<div id="error"></div>



</div>





<script>


function unlock(){


let pass =
document.getElementById("password").value;



if(pass==="anu123"){


window.location.href="home.html";


}

else{


document.getElementById("error").innerHTML=

"Wrong password 💔 Try again";


}


}





// floating hearts


setInterval(()=>{


let h=document.createElement("div");


h.className="heart";


h.innerHTML="❤️";


h.style.left=Math.random()*100+"%";


h.style.animationDuration=

(5+Math.random()*5)+"s";


document.body.appendChild(h);



setTimeout(()=>{

h.remove();

},10000);



},500);



</script>



</body>

</html>
