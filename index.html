<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Surprise For Anu ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

font-family:Poppins,sans-serif;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

color:white;


background:

linear-gradient(
120deg,
#ff416c,
#ff4b2b,
#ff758c,
#ff7eb3
);


background-size:400% 400%;

animation:bgMove 10s infinite alternate;


}



@keyframes bgMove{


0%{

background-position:left;

}


100%{

background-position:right;

}


}



/* ===================
LOADER
=================== */


#loader{


position:fixed;

inset:0;


display:flex;

flex-direction:column;

justify-content:center;

align-items:center;


background:

linear-gradient(
135deg,
#ff416c,
#ff4b2b
);


z-index:100;


animation:fadeIn 1s;


}



.loader-heart{


font-size:clamp(70px,15vw,120px);


animation:

heartbeat 1s infinite,
rotate 3s infinite linear;


}



@keyframes heartbeat{


50%{

transform:scale(1.3);

}


}



@keyframes rotate{


100%{

filter:hue-rotate(360deg);

}


}



.loader-title{


font-family:'Great Vibes';


font-size:

clamp(40px,8vw,75px);


text-align:center;


margin-top:20px;


animation:textGlow 2s infinite;


}




@keyframes textGlow{


50%{

text-shadow:0 0 30px white;

}


}




.loader-subtitle{


font-size:

clamp(14px,3vw,20px);


margin-top:10px;


}




.loading-bar{


width:min(80vw,300px);


height:10px;


background:

rgba(255,255,255,.3);


border-radius:50px;


margin-top:30px;


overflow:hidden;


}



.progress{


height:100%;


background:white;


width:0;


animation:load 3s forwards;


}



@keyframes load{


100%{

width:100%;

}


}





/* ===================
PASSWORD CARD
=================== */


.box{


display:none;


width:min(90%,450px);


padding:

clamp(25px,6vw,50px);



background:

rgba(255,255,255,.18);


backdrop-filter:blur(25px);


border-radius:35px;


text-align:center;


box-shadow:

0 30px 80px rgba(0,0,0,.5);


animation:

cardShow 1.2s ease;


}



@keyframes cardShow{


from{

opacity:0;

transform:

translateY(80px)
scale(.7);


}


to{

opacity:1;

transform:

translateY(0)
scale(1);


}


}




.lock{


font-size:

clamp(70px,15vw,110px);


animation:lockMove 2s infinite;


}



@keyframes lockMove{


50%{

transform:

translateY(-15px)
rotate(5deg);


}


}





h1{


font-family:'Great Vibes';


font-size:

clamp(45px,10vw,75px);


margin:20px 0;


}



.message{


font-size:

clamp(14px,4vw,19px);


line-height:1.6;


}




input{


margin-top:20px;


width:100%;


padding:16px;


border:none;


border-radius:50px;


font-size:16px;


text-align:center;


outline:none;


transition:.4s;


}



input:focus{


transform:scale(1.05);


box-shadow:

0 0 25px white;


}





button{


margin-top:25px;


padding:

15px clamp(30px,8vw,50px);


border:none;


border-radius:50px;


background:white;


color:#ff416c;


font-size:18px;


font-weight:bold;


cursor:pointer;


animation:pulse 2s infinite;


}



@keyframes pulse{


50%{

transform:scale(1.08);


}


}




#error{


margin-top:20px;

}



/* ===================
HEART PARTICLES
=================== */


.heart{


position:absolute;


bottom:-50px;


font-size:

clamp(20px,5vw,35px);


animation:

rise linear infinite;


}



@keyframes rise{


0%{


transform:

translateY(0)
rotate(0);


opacity:1;


}



100%{


transform:

translateY(-120vh)
rotate(360deg);


opacity:0;


}



}



/* Mobile */


@media(max-width:480px){


.box{


border-radius:25px;


}



.loader-title{


padding:0 20px;


}



button{


font-size:16px;


}


}


</style>


</head>



<body>




<!-- LOADING -->

<div id="loader">


<div class="loader-heart">

❤️

</div>


<div class="loader-title">

Preparing Your Surprise Anu...

</div>


<div class="loader-subtitle">

Made with love by Shreyash ❤️

</div>


<div class="loading-bar">

<div class="progress"></div>

</div>


</div>






<!-- PASSWORD -->


<div class="box" id="login">


<div class="lock">

🔐

</div>



<h1>

Only For Anu

</h1>



<div class="message">

A special world created only for you ❤️

</div>




<input

type="password"

id="password"

placeholder="Enter Secret Password"



>



<button onclick="unlock()">

Open My Heart 💕

</button>


<div id="error"></div>



</div>






<script>


// Loader


setTimeout(()=>{


document.getElementById("loader").style.display="none";


document.getElementById("login").style.display="block";


},3000);





// Password


function unlock(){


let pass=document.getElementById("password").value;



if(pass==="anu123"){


document.body.style.opacity="0";


setTimeout(()=>{


window.location.href="home.html";


},700);


}

else{


document.getElementById("error").innerHTML=

"💔 Wrong Password";


}


}






// Hearts


setInterval(()=>{


let h=document.createElement("div");


h.className="heart";


h.innerHTML=

["❤️","💕","💖","🌹","✨"]
[Math.floor(Math.random()*5)];



h.style.left=Math.random()*100+"%";



h.style.animationDuration=

(5+Math.random()*6)+"s";



document.body.appendChild(h);



setTimeout(()=>{


h.remove();


},12000);



},400);



</script>



</body>

</html>
