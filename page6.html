<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Memories ❤️</title>


<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}



body{

min-height:100vh;

font-family:Poppins,sans-serif;

background:

linear-gradient(
135deg,
#ff758c,
#ff7eb3,
#ffd1dc
);


overflow-x:hidden;

padding:30px;


}



/* Heading */


h1{

font-family:'Great Vibes';

font-size:85px;

color:white;

text-align:center;

margin-bottom:20px;

}



.subtitle{

text-align:center;

color:white;

font-size:22px;

margin-bottom:40px;

}




/* Gallery */


.gallery{


display:grid;


grid-template-columns:

repeat(auto-fit,minmax(250px,1fr));


gap:30px;


max-width:1100px;

margin:auto;


}



.card{


background:white;


padding:15px;


border-radius:25px;


box-shadow:

0 20px 40px rgba(0,0,0,.3);


transition:.5s;


animation:show 1s;


}



.card:hover{


transform:

translateY(-15px)
scale(1.03);


}



.card img{


width:100%;


height:300px;


object-fit:cover;


border-radius:20px;


}



.caption{


text-align:center;


padding:15px;


font-size:18px;


color:#d6336c;


font-weight:bold;


}




@keyframes show{


from{

opacity:0;

transform:translateY(50px);

}


to{

opacity:1;

transform:translateY(0);

}


}




/* Button */


button{


display:block;


margin:50px auto;


padding:18px 50px;


border:none;


border-radius:50px;


background:white;


color:#d6336c;


font-size:18px;


font-weight:bold;


cursor:pointer;


}



button:hover{


transform:scale(1.1);


}




/* Floating hearts */


.heart{


position:fixed;


bottom:-50px;


font-size:30px;


animation:float 8s linear infinite;


}



@keyframes float{


to{


transform:translateY(-110vh);


}


}





</style>

</head>


<body>



<h1>

Our Memories ❤️

</h1>


<div class="subtitle">

Every moment with you is special, Anu...

</div>




<div class="gallery">


<div class="card">

<img src="images/memory1.jpg">

<div class="caption">

Our Beautiful Beginning ❤️

</div>

</div>




<div class="card">

<img src="images/memory2.jpg">

<div class="caption">

Your Smile Is My Favorite View 😊

</div>

</div>





<div class="card">

<img src="images/memory3.jpg">

<div class="caption">

Moments I Never Want To Forget 💕

</div>

</div>





<div class="card">

<img src="images/memory4.jpg">

<div class="caption">

Forever Memories 🌹

</div>

</div>



</div>





<button onclick="nextPage()">

Our Love Timeline ⏳

</button>





<script>


// Hearts


setInterval(()=>{


let h=document.createElement("div");


h.className="heart";


h.innerHTML="❤️";


h.style.left=Math.random()*100+"%";


h.style.animationDuration=

(5+Math.random()*5)+"s";


document.body.appendChild(h);



setTimeout(()=>{

h.remove();

},10000);



},500);





function nextPage(){

window.location.href="page7.html";

}


</script>



</body>

</html>
